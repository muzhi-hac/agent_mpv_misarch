name: misarch-agent-video

services:
  agent-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: misarch-agent-gateway:video
    container_name: misarch-agent-gateway-video
    environment:
      HTTP_ADDR: ":8001"
      PUBLIC_BASE_URL: "http://127.0.0.1:8001"
      MISARCH_GRAPHQL_URL: "http://host.docker.internal:8080/graphql"
      MISARCH_GRAPHQL_TIMEOUT: "10s"
      MISARCH_KEYCLOAK_TOKEN_URL: "http://host.docker.internal:8081/keycloak/realms/Misarch/protocol/openid-connect/token"
      MISARCH_KEYCLOAK_CLIENT_ID: "${VIDEO_KEYCLOAK_CLIENT_ID:-frontend}"
      MISARCH_KEYCLOAK_USERNAME: "${VIDEO_KEYCLOAK_USERNAME:-gatling}"
      MISARCH_KEYCLOAK_PASSWORD: "${VIDEO_KEYCLOAK_PASSWORD:-123}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8001/readyz >/dev/null || exit 1
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: unless-stopped
